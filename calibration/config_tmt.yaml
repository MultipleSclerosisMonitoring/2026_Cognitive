data:
  # Database credentials are loaded from environment variables
  # See .env.example for required variables: DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
  db_host: "localhost"  # Fallback, overridden by DB_HOST env var
  db_port: "5432"       # Fallback, overridden by DB_PORT env var
  excel_path: "./data/datos_papel.xlsx"
  clinical_skiprows: 2
  test_type: "tmt"
  feature_filters:
    allowed_derived_features:
      - "age_at_test"
      - "sex_binary"
      - "delta_dias_digital_papel"
    allowed_categorical_features:
      - "clinical_group"
      - "education_band"
    max_train_missing_rate: 0.35
    min_train_unique_values: 2
    min_train_std: 1.0e-8
    tmt_use_advanced_kinematics: true
    tmt_transform_strategy: "log1p"
    tmt_feature_selection_enabled: true
    tmt_include_demographic_covariates: false
    tmt_feature_selection_max_features: 24
    tmt_feature_selection_min_features: 8
    tmt_feature_selection_step_ratio: 0.2
  # Column configuration per test type
  column_mapping:
    sdmt:
      target_columns:
        - name: "sdmt_paper_score"
          hints:
            - "Día 1 SDMT Papel score"
            - "SDMT Papel"
            - "sdmt_papel"
      features_to_drop:
        - "id"
        - "codeid"
        - "ts_created"
        - "ts_updated"
        - "patient_id"
        - "sset"
        - "EDSS"
    tmt:
      target_columns:
        - name: "tmt_paper_score_a"
          group: "score"
          hints:
            - "DIA 1 TMT papel (tiempo) A"
            - "TMT papel (tiempo) A"
            - "tmt papel tiempo a"
        - name: "tmt_paper_score_b"
          group: "score"
          hints:
            - "DIA 1 TMT papel (tiempo) B"
            - "TMT papel (tiempo) B"
            - "tmt papel tiempo b"
        - name: "tmt_paper_errors_a"
          group: "errors"
          hints:
            - "DIA 1 TMT papel (errores) A"
            - "TMT papel (errores) A"
            - "tmt papel errores a"
        - name: "tmt_paper_errors_b"
          group: "errors"
          hints:
            - "DIA 1 TMT papel (errores) B"
            - "TMT papel (errores) B"
            - "tmt papel errores b"
      features_to_drop:
        - "id"
        - "codeid"
        - "ts_created"
        - "ts_updated"
        - "patient_id"
        - "EDSS"
models:
  - type: "ridge"
    target_mode: "single_output"
    cv_folds: 3
    search_strategy: "grid"
    param_grid:
      alpha: [0.1, 1.0, 5.0, 10.0]
  - type: "rf"
    target_mode: "grouped_multi_output"
    cv_folds: 3
    stratify_by: "education_band"
    min_train_samples_per_stratum: 10
    min_unique_groups_per_stratum: 2
    search_strategy: "random"
    n_iter: 20
    param_grid:
      n_estimators: [150, 300]
      max_depth: [6, 8, null]
      min_samples_leaf: [1, 2, 4]
  - type: "xgboost"
    target_mode: "single_output"
    cv_folds: 3
    search_strategy: "grid"
    param_grid:
      learning_rate: [0.03, 0.05, 0.1]
      max_depth: [3, 4]
      n_estimators: [150, 250]
      subsample: [0.8, 1.0]
  - type: "ensemble"
    target_mode: "single_output"
    cv_folds: 3
  - type: "error_classifier"
    target_mode: "single_output"
    cv_folds: 3
    stratify_by: "education_band"
    min_train_samples_per_stratum: 10
    min_unique_groups_per_stratum: 2
    targets: ["tmt_paper_errors_a", "tmt_paper_errors_b"]
uncertainty:
  enabled: true
  conformal_alpha: 0.10
  calibration_size: 0.20
  bootstrap_iterations: 500
  bootstrap_confidence: 0.95
  random_state: 42
output:
  excel_report: "resultados_tmt.xlsx"
  html_plot: "graficos_tmt.html"
