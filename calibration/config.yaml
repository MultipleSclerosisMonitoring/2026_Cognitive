data:
  # Database credentials are loaded from environment variables
  # See .env.example for required variables: DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
  db_host: "localhost"  # Fallback, overridden by DB_HOST env var
  db_port: "5432"       # Fallback, overridden by DB_PORT env var
  excel_path: "./data/datos_papel.xlsx"
  clinical_skiprows: 2
  test_type: "sdmt"
  # Column configuration per test type
  column_mapping:
    sdmt:
      target_columns:
        - name: "sdmt_paper_score"
          hints:
            - "Día 1 SDMT Papel score"
            - "SDMT Papel"
            - "sdmt_papel"
      features_to_drop:
        - "id"
        - "codeid"
        - "ts_created"
        - "ts_updated"
        - "patient_id"
        - "sset"
        - "EDSS"
    tmt:
      target_columns:
        - name: "tmt_paper_score_a"
          group: "score"
          hints:
            - "DIA 1 TMT papel A"
            - "TMT papel A"
            - "tmt papel a"
            - "tiempo a"
        - name: "tmt_paper_score_b"
          group: "score"
          hints:
            - "DIA 1 TMT papel B"
            - "TMT papel B"
            - "tmt papel b"
            - "tiempo b"
        - name: "tmt_paper_errors_a"
          group: "errors"
          hints:
            - "DIA 1 TMT papel errores A"
            - "TMT papel errores A"
            - "errores a"
        - name: "tmt_paper_errors_b"
          group: "errors"
          hints:
            - "DIA 1 TMT papel errores B"
            - "TMT papel errores B"
            - "errores b"
      features_to_drop:
        - "id"
        - "codeid"
        - "ts_created"
        - "ts_updated"
        - "patient_id"
        - "EDSS"
models:
  - type: "linear"
    target_mode: "single_output"
    cv_folds: 3
  - type: "rf"
    target_mode: "single_output"
    cv_folds: 3
    search_strategy: "random"
    n_iter: 50
    param_grid:
      n_estimators: [50, 100]
      max_depth: [null, 10]
  - type: "rf"
    target_mode: "grouped_multi_output"
    cv_folds: 3
    search_strategy: "random"
    n_iter: 50
    param_grid:
      n_estimators: [50, 100]
      max_depth: [null, 10]
  - type: "xgboost"
    target_mode: "single_output"
    cv_folds: 3
    search_strategy: "grid"
    param_grid:
      learning_rate: [0.01, 0.1]
      max_depth: [3, 5]
output:
  excel_report: "resultados.xlsx"
  html_plot: "graficos.html"
