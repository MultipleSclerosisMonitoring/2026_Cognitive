data:
  # Database credentials are loaded from environment variables
  # See .env.example for required variables: DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
  db_host: "localhost"  # Fallback, overridden by DB_HOST env var
  db_port: "5432"       # Fallback, overridden by DB_PORT env var
  excel_path: "./data/datos_papel.xlsx"
  test_type: "sdmt"
models:
  - type: "linear"
    cv_folds: 3
  - type: "rf"
    cv_folds: 3
    search_strategy: "random"
    n_iter: 50
    param_grid:
      n_estimators: [50, 100]
      max_depth: [null, 10]
  - type: "xgboost"
    cv_folds: 3
    search_strategy: "grid"
    param_grid:
      learning_rate: [0.01, 0.1]
      max_depth: [3, 5]
output:
  excel_report: "resultados.xlsx"
  html_plot: "graficos.html"
language: "en"
